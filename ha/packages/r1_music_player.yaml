# 复用 HA 原生 REST 传感器和通用播放器，将 R1 放入自动区域总览。
sensor:
  - platform: rest
    name: R1 Music Status
    unique_id: r1_music_status
    resource: http://127.0.0.1:8095/api
    method: POST
    headers:
      Authorization: !include r1_music_authorization.yaml
      Content-Type: application/json
    payload: '{"command":"players/get","args":{"player_id":"upbac50e55"}}'
    scan_interval: 2
    timeout: 8
    value_template: >-
      {{ value_json.playback_state if value_json.available | default(false) else 'unavailable' }}
    json_attributes:
      - volume_level
      - current_media


  - platform: rest
    name: R1 Music Volume
    unique_id: r1_music_volume
    resource: http://192.168.1.3:8080/voice_volume?target=music
    scan_interval: 10
    timeout: 3
    unit_of_measurement: "%"
    value_template: "{{ value_json.percent }}"
  - platform: rest
    name: R1 Speech Volume
    unique_id: r1_speech_volume
    resource: http://192.168.1.3:8080/voice_volume?target=speech
    scan_interval: 10
    timeout: 3
    unit_of_measurement: "%"
    value_template: "{{ value_json.percent }}"

template:
  - sensor:
      - name: R1 Music Display
        unique_id: r1_music_display
        state: "{{ states('sensor.r1_music_status') }}"
        attributes:
          media_content_type: music
          volume_level: "{{ (states('sensor.r1_music_volume') | float(0)) / 100 }}"
          media_title: "{{ (state_attr('sensor.r1_music_status', 'current_media') or {}).get('title', '') }}"
          media_artist: "{{ (state_attr('sensor.r1_music_status', 'current_media') or {}).get('artist', '') }}"
          media_album_name: "{{ (state_attr('sensor.r1_music_status', 'current_media') or {}).get('album', '') }}"
          media_duration: "{{ (state_attr('sensor.r1_music_status', 'current_media') or {}).get('duration', 0) or 0 }}"
          entity_picture: "{{ (state_attr('sensor.r1_music_status', 'current_media') or {}).get('image_url', '') }}"

script:
  r1_music_player_control:
    alias: R1 播放器按钮控制
    mode: restart
    sequence:
      - choose:
          - conditions: "{{ operation == 'volume' }}"
            sequence:
              - action: script.r1_volume_control
                data:
                  volume_target: music
                  operation: set
                  percent: "{{ (volume_level | float(0) * 100) | round | int }}"
        default:
          - action: script.r1_music_control
            data:
              operation: "{{ operation }}"
              playback_delay: 0
      # 不在按钮请求中等待轮询；状态由两秒轮询及下次操作自然刷新。

media_player:
  - platform: universal
    name: R1 Apple Music
    unique_id: r1_apple_music_bedroom
    device_class: speaker
    children:
      - sensor.r1_music_display
    commands:
      media_play_pause:
        action: script.r1_music_player_control
        data:
          operation: "{{ 'pause' if is_state('sensor.r1_music_status', 'playing') else 'resume' }}"
      media_play:
        action: script.r1_music_player_control
        data:
          operation: resume
      media_pause:
        action: script.r1_music_player_control
        data:
          operation: pause
      media_stop:
        action: script.r1_music_player_control
        data:
          operation: stop
      media_next_track:
        action: script.r1_music_player_control
        data:
          operation: next
      media_previous_track:
        action: script.r1_music_player_control
        data:
          operation: previous
      volume_set:
        action: script.r1_music_player_control
        data:
          operation: volume
          volume_level: "{{ volume_level }}"
    attributes:
      state: sensor.r1_music_status
      volume_level: sensor.r1_music_display|volume_level
