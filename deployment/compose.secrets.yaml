# 显式启用此覆盖文件，秘密文件由用户在仓库外准备。
services:
  voice:
    environment:
      R1_ASR_API_KEY_FILE: /run/secrets/asr_api_key
      R1_TTS_API_KEY_FILE: /run/secrets/tts_api_key
      R1_MA_TOKEN_FILE: /run/secrets/ma_token
    secrets: [asr_api_key,tts_api_key,ma_token]
secrets:
  asr_api_key:
    file: ${R1_ASR_SECRET_FILE:?指定仓库外 ASR 密钥文件}
  tts_api_key:
    file: ${R1_TTS_SECRET_FILE:?指定仓库外 TTS 密钥文件}
  ma_token:
    file: ${R1_MA_SECRET_FILE:?指定仓库外 MA 令牌文件}
